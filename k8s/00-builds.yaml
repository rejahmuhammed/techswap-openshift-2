apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: techswap-backend}
spec:
  source: {type: Binary}
  strategy: {type: Docker, dockerStrategy: {dockerfilePath: backend.Dockerfile}}
  output: {to: {kind: ImageStreamTag, name: techswap-backend:latest}}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: techswap-backend}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: techswap-frontend}
spec:
  source: {type: Binary}
  strategy: {type: Docker, dockerStrategy: {dockerfilePath: frontend.Dockerfile}}
  output: {to: {kind: ImageStreamTag, name: techswap-frontend:latest}}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: techswap-frontend}
