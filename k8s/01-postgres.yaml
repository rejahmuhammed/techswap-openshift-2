apiVersion: v1
kind: Secret
metadata: {name: postgres-secret}
type: Opaque
stringData:
  POSTGRES_DB: techswap
  POSTGRES_USER: techswap
  POSTGRES_PASSWORD: TechSwapDB2026!
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        envFrom: [{secretRef: {name: postgres-secret}}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
        readinessProbe: {exec: {command: ["sh","-c","pg_isready -U techswap -d techswap"]}, initialDelaySeconds: 5, periodSeconds: 5}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
