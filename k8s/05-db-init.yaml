apiVersion: v1
kind: ConfigMap
metadata: {name: techswap-schema}
data:
  schema.sql: |
    -- Migration: 001_create_users_table.sql
    -- Create users table with role field (USER | ADMIN)
    
    CREATE TABLE IF NOT EXISTS users (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(100) NOT NULL,
      email VARCHAR(255) UNIQUE NOT NULL,
      password_hash VARCHAR(255) NOT NULL,
      phone VARCHAR(20),
      location VARCHAR(255),
      role VARCHAR(10) DEFAULT 'USER' CHECK (role IN ('USER','ADMIN')),
      created_at TIMESTAMPTZ DEFAULT now(),
      updated_at TIMESTAMPTZ DEFAULT now()
    );
    
    -- Index on email for fast lookups
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    
    -- Index on role for admin queries
    CREATE INDEX IF NOT EXISTS idx_users_role ON users(role);    
    -- Migration: 002_create_categories_table.sql
    -- Categories for product classification
    
    CREATE TABLE IF NOT EXISTS categories (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(50) NOT NULL,
      slug VARCHAR(50) UNIQUE NOT NULL,
      parent_id UUID REFERENCES categories(id),
      created_at TIMESTAMPTZ DEFAULT now()
    );
    
    -- Index on slug for lookups
    CREATE INDEX IF NOT EXISTS idx_categories_slug ON categories(slug);    
    -- Migration: 003_create_products_table.sql
    -- Main product/inventory table
    
    CREATE TABLE IF NOT EXISTS products (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      name VARCHAR(200) NOT NULL,
      description TEXT,
      category_id UUID REFERENCES categories(id),
      brand VARCHAR(100) NOT NULL,
      model VARCHAR(100),
      price INTEGER NOT NULL,          -- stored in paise (1/100 of currency unit)
      condition VARCHAR(20) DEFAULT 'NEW' CHECK (condition IN ('NEW','PRE_OWNED')),
      stock INTEGER DEFAULT 0,
      seller_id UUID REFERENCES users(id) ON DELETE SET NULL,
      location VARCHAR(255),
      image_url TEXT,
      created_at TIMESTAMPTZ DEFAULT now(),
      updated_at TIMESTAMPTZ DEFAULT now()
    );
    
    -- Indexes for common query patterns
    CREATE INDEX IF NOT EXISTS idx_products_category ON products(category_id);
    CREATE INDEX IF NOT EXISTS idx_products_brand ON products(brand);
    CREATE INDEX IF NOT EXISTS idx_products_condition ON products(condition);
    CREATE INDEX IF NOT EXISTS idx_products_seller ON products(seller_id);
    CREATE INDEX IF NOT EXISTS idx_products_created ON products(created_at DESC);    
    -- Migration: 004_create_orders_table.sql
    -- Order system
    
    CREATE TABLE IF NOT EXISTS orders (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID REFERENCES users(id) NOT NULL,
      total_amount INTEGER NOT NULL,
      status VARCHAR(20) DEFAULT 'PENDING' CHECK (status IN ('PENDING','CONFIRMED','PROCESSING','SHIPPED','DELIVERED','CANCELLED')),
      payment_status VARCHAR(20) DEFAULT 'PENDING' CHECK (payment_status IN ('PENDING','PAID','FAILED','REFUNDED')),
      created_at TIMESTAMPTZ DEFAULT now(),
      updated_at TIMESTAMPTZ DEFAULT now()
    );
    
    -- Index on user for order history
    CREATE INDEX IF NOT EXISTS idx_orders_user ON orders(user_id);
    -- Index on status for filtering
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);    
    -- Migration: 005_create_order_items_table.sql
    -- Individual items within each order
    
    CREATE TABLE IF NOT EXISTS order_items (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      order_id UUID REFERENCES orders(id) ON DELETE CASCADE,
      product_id UUID REFERENCES products(id),
      quantity INTEGER DEFAULT 1,
      price INTEGER NOT NULL,          -- snapshot price at purchase time
      created_at TIMESTAMPTZ DEFAULT now()
    );
    
    -- Index on order for order items lookup
    CREATE INDEX IF NOT EXISTS idx_order_items_order ON order_items(order_id);
    -- Index on product for inventory queries
    CREATE INDEX IF NOT EXISTS idx_order_items_product ON order_items(product_id);    
    -- Migration: 006_create_reviews_table.sql
    -- Product/technician reviews
    
    CREATE TABLE IF NOT EXISTS reviews (
      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id UUID REFERENCES users(id) NOT NULL,
      product_id UUID REFERENCES products(id),
      technician_id UUID REFERENCES users(id), -- for technician reviews
      rating SMALLINT CHECK (rating >= 1 AND rating <= 5),
      comment TEXT,
      created_at TIMESTAMPTZ DEFAULT now(),
      -- Prevent duplicate reviews from same user on same product
      UNIQUE(user_id, product_id)
    );
    
    -- Index on product for product reviews
    CREATE INDEX IF NOT EXISTS idx_reviews_product ON reviews(product_id);
    -- Index on technician for technician reviews
    CREATE INDEX IF NOT EXISTS idx_reviews_technician ON reviews(technician_id);    
