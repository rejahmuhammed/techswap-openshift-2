apiVersion: v1
kind: Secret
metadata: {name: backend-secret}
type: Opaque
stringData:
  DATABASE_URL: postgresql://techswap:TechSwapDB2026!@postgres:5432/techswap
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: image-registry.openshift-image-registry.svc:5000/rejahmuhammed-dev/techswap-backend:latest
        ports: [{containerPort: 3000}]
        envFrom: [{secretRef: {name: backend-secret}}]
        env: [{name: PORT, value: "3000"}]
        readinessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 15, periodSeconds: 10}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 3000, targetPort: 3000}]
